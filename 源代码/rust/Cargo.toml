[workspace]
resolver = "2"
members = [
    "common",
    "checksec",
    "libc-sym",
    "got",
    "fmt",
    "offset",
    "shell",
    "gdb-gen",
    "seccomp",
    "encdec",
    "filetype",
    "extract",
    "spectro",
    "dsstore",
    "trav",
    "jwt",
    "sqli",
    "lfi",
    "ssti",
    "cmdi",
    "gitdump",
    "githack",
    "hgdump",
    "svndump",
    "dumpvcs",
    "xssserv",
    "analyze",
    "elf",
    "heap",
    "one",
    "pcap",
    "qr",
    "stego",
    "visual",
    "xor",
    "carve",
    "entropy",
    "ctfhelp",
    "brute",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
common = { path = "common" }
clap = { version = "4", features = ["derive"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
goblin = "0.8"
flate2 = "1"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
percent-encoding = "2"
ureq = "3"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd"] }
bzip2 = "0.5"
xz2 = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
url = "2"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
